name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies (also copies Phaser into www/)
        run: npm install

      - name: Run game tests
        run: npm test

      - name: Generate the Android project
        run: npx cap add android

      - name: Icons, landscape and full screen
        run: npm run android:patch

      - name: Copy the web game into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taguan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
