<!doctype html>
<html><head><meta charset="utf-8"><title>Character preview</title>
<style>body{margin:0;background:#2a3358;font:12px sans-serif;color:#fff;padding:8px}canvas{image-rendering:pixelated;display:block;margin:4px 0;background:#3b4570}</style></head>
<body><div id="root"></div>
<script src="../www/js/config.js"></script>
<script src="../www/js/core/util.js"></script>
<script src="../www/js/art/pixel.js"></script>
<script src="../www/js/assets.js"></script>
<script src="../www/js/art/characters.js"></script>
<script>
const load = (src) => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });
(async () => {
  CharArt.images.hider = await load(ASSETS.hider);
  CharArt.images.seeker = await load(ASSETS.seeker);
  const root = document.getElementById('root');
  const row = (label, who, outfit) => {
    const anchors = ASSETS.anchors[who];
    const c = CharArt.makeSheet(who, outfit, anchors);
    const t = document.createElement('div'); t.textContent = label; root.appendChild(t);
    // show frames 0..13 in one line, scaled 1.5
    const out = document.createElement('canvas'); out.width = 14 * 64; out.height = 100;
    const ctx = out.getContext('2d');
    for (let i = 0; i < 14; i++) ctx.drawImage(c, (i % 7) * 64, Math.floor(i / 7) * 100, 64, 100, i * 64, 0, 64, 100);
    out.style.width = (out.width * 1.2) + 'px';
    root.appendChild(out);
  };
  row('seeker', 'seeker', null);
  for (const h of HOODIES) row('hider ' + h.id, 'hider', { hoodie: h.id, acc: 'none' });
  for (const a of ACCESSORIES) row('hider blue + ' + a.id, 'hider', { hoodie: 'blue', acc: a.id });
  window.__done = true;
})();
</script></body></html>
