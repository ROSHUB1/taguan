<!doctype html>
<html><head><meta charset="utf-8"><title>Map preview</title>
<style>body{margin:0;background:#111;color:#fff;font:12px sans-serif}canvas{display:block}</style></head>
<body><div id="root"></div>
<script src="../www/js/config.js"></script>
<script src="../www/js/core/util.js"></script>
<script src="../www/js/core/grid.js"></script>
<script src="../www/js/art/pixel.js"></script>
<script src="../www/js/art/ground.js"></script>
<script src="../www/js/art/objects.js"></script>
<script src="../www/js/art/mapRender.js"></script>
<script src="../www/js/world/mapBuilder.js"></script>
<script src="../www/js/world/maps.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id') || 'barangay';
const scale = parseFloat(new URLSearchParams(location.search).get('scale') || '0.6');
const model = buildMap(id);
const c = MapRender.full(model);
const ctx = c.getContext('2d');
// debug overlay: spots (green), base (gold), spawns
const T = CONFIG.TILE;
for (const s of model.spots) { ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2; ctx.strokeRect(s.tx * T + 2, s.ty * T + 2, T - 4, T - 4); ctx.fillStyle = '#ffff00'; ctx.fillRect(s.ax - 2, s.ay - 2, 4, 4); }
ctx.fillStyle = '#ff00ff'; ctx.fillRect(model.playerSpawn.x - 4, model.playerSpawn.y - 4, 8, 8);
ctx.fillStyle = '#ff0000'; ctx.fillRect(model.seekerStart.x - 4, model.seekerStart.y - 4, 8, 8);
model.npcSpawns.forEach(p => { ctx.fillStyle = '#00ffff'; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); });
c.style.width = (c.width * scale) + 'px';
document.getElementById('root').appendChild(c);
const mini = MapRender.mini(model, 4); mini.style.width = '224px'; mini.style.position = 'absolute'; mini.style.left = '8px'; mini.style.top = '8px'; mini.style.border = '2px solid #fff';
document.getElementById('root').appendChild(mini);
console.log('spots=' + model.spots.length + ' objects=' + model.objects.length + ' npcSpawns=' + model.npcSpawns.length);
</script></body></html>
