<!doctype html>
<html><head><meta charset="utf-8"><title>Art preview</title>
<style>body{margin:0;background:#5fae4e;font:12px sans-serif;color:#fff}.row{display:flex;flex-wrap:wrap;gap:14px;padding:10px;align-items:flex-end}
.c{display:flex;flex-direction:column;align-items:center}canvas{image-rendering:pixelated}</style></head>
<body><div id="root" class="row"></div>
<script src="../www/js/config.js"></script>
<script src="../www/js/core/util.js"></script>
<script src="../www/js/art/pixel.js"></script>
<script src="../www/js/art/ground.js"></script>
<script src="../www/js/art/objects.js"></script>
<script>
const root = document.getElementById('root');
const only = new URLSearchParams(location.search).get('only');
const scale = parseFloat(new URLSearchParams(location.search).get('scale') || '1');
for (const type of Object.keys(OBJECTS)) {
  if (only && !only.split(',').includes(type)) continue;
  const def = OBJECTS[type];
  for (let v = 0; v < def.variants; v++) {
    const c = Objects.canvas(type, v);
    const d = document.createElement('div'); d.className = 'c';
    const cv = document.createElement('canvas'); cv.width = c.width; cv.height = c.height;
    cv.style.width = (c.width * scale) + 'px';
    cv.getContext('2d').drawImage(c, 0, 0);
    d.appendChild(cv); d.appendChild(document.createTextNode(type + ' v' + v));
    root.appendChild(d);
  }
}
window.__done = true;
</script></body></html>
