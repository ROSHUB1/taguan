<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>TAGUAN</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121836; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; }
    canvas { display: block; }
  </style>
  <!-- Phaser 3 engine, copied locally by scripts/copy-phaser.js during npm install -->
  <script src="js/vendor/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <!-- Classic scripts (not ES modules) so the game also runs from disk and inside Capacitor. Order matters. -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/grid.js"></script>
  <script src="js/core/seekerBrain.js"></script>
  <script src="js/core/hiderBrain.js"></script>
  <script src="js/art/pixel.js"></script>
  <script src="js/art/ground.js"></script>
  <script src="js/art/objects.js"></script>
  <script src="js/art/characters.js"></script>
  <script src="js/art/mapRender.js"></script>
  <script src="js/world/mapBuilder.js"></script>
  <script src="js/world/maps.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scenes/boot.js"></script>
  <script src="js/scenes/menu.js"></script>
  <script src="js/scenes/mapselect.js"></script>
  <script src="js/scenes/customize.js"></script>
  <script src="js/scenes/info.js"></script>
  <script src="js/scenes/game.js"></script>
  <script src="js/scenes/hud.js"></script>
  <script src="js/scenes/result.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
